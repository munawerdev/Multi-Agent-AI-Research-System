[project]
name = "multi-agent-ai-research-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "munawerdev", email = "munawer.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "lxml>=6.1.3",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "watchdog>=6.0.0",
]

[project.scripts]
multi-agent-ai-research-system = "multi_agent_ai_research_system:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
